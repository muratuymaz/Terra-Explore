<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraExplore | Country Details</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/country.css">
</head>
<body id="countryBody">
    <!-- Country page -->
    <header class="menu">
        <div class="logo">
            <a href="index.html"><h1>Terra Explore</h1></a>
        </div>
        
        <nav class="menu-links">
            <a href="#">About Us</a>
            <a href="#">Popular Places</a>
        </nav>

        <div class="menu-actions">
            <a class="button-light" href="signup.html">Sign Up</a>
        </div>
    </header>

    <main class="detail-page">
        
        <section id="countryInfo" class="country-card">
            <div class="flag-container">
                <img id="countryFlag" src="" alt="Country Flag" hidden>
            </div>
            <div class="info-text">
                <h2 id="countryName">Loading...</h2>
                <ul class="info-list">
                    <li><strong>Capital:</strong> <span id="capitalText">-</span></li>
                    <li><strong>Population:</strong> <span id="populationText">-</span></li>
                    <li><strong>Language(s):</strong> <span id="languageText">-</span></li>
                    <li><strong>Currency:</strong> <span id="currencyText">-</span></li>
                </ul>
            </div>
        </section>

        <section class="places-area">
            <p>Want to explore the most popular places across this country?</p>
            <button id="popularPlacesBtn" class="button" disabled>Show Popular Places</button>
            <p id="popularPlacesFeedback" class="places-feedback" hidden></p>

            <div id="popularPlacesGrid" class="cards-box">
                </div>
        </section>
    </main>

    <script type="module" src="js/country.js"></script>

    <footer class="footer">
        <p class="footer-text">&copy; 2026 Terra Explore. Developed for Web Technologies Course</p>
    </footer>
</body>
</html>
