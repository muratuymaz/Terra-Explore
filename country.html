<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraExplore | Country Details</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234e835f'/%3E%3Ctext x='50%25' y='53%25' text-anchor='middle' dominant-baseline='middle' font-size='36'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E">
    <link rel="shortcut icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234e835f'/%3E%3Ctext x='50%25' y='53%25' text-anchor='middle' dominant-baseline='middle' font-size='36'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/country.css">
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >
</head>
<body id="countryBody">
    <!-- Country page -->
    <header class="menu">
        <div class="logo">
            <a class="logo-link" href="index.html">
                <h1>Terra Explore</h1>
                <span class="logo-mark" aria-hidden="true">🌍</span>
            </a>
        </div>
        
        <nav class="menu-links">
            <a href="index.html">Home</a>
            <a href="compare-countries.html">Compare Countries</a>
        </nav>

        <div class="menu-actions" data-auth-menu>
            <a class="button-light" href="signup.html">Sign Up</a>
            <a class="button-light" href="login.html">Login</a>
        </div>
    </header>

    <main class="detail-page">
        <!-- Main country summary with flag, facts, and saved actions -->
        <section id="countryInfo" class="country-card">
            <div class="flag-container">
                <img id="countryFlag" src="" alt="Country Flag" hidden>
            </div>
            <div class="info-text">
                <h2 id="countryName">Loading...</h2>
                <ul class="info-list">
                    <li><strong>Capital:</strong> <span id="capitalText">-</span></li>
                    <li><strong>Population:</strong> <span id="populationText">-</span></li>
                    <li><strong>Language(s):</strong> <span id="languageText">-</span></li>
                    <li><strong>Currency:</strong> <span id="currencyText">-</span></li>
                </ul>
                <div class="country-actions">
                    <button id="favoriteCountryBtn" type="button" class="button-light">Add to Favorites</button>
                    <button id="visitedCountryBtn" type="button" class="button-light">Mark as Visited</button>
                    <button id="wantToVisitCountryBtn" type="button" class="button-light">Want to Visit</button>
                </div>
            </div>
        </section>

        <!-- Leaflet map area focused on the selected country -->
        <section class="country-map-area">
            <div class="country-map-header">
                <h3>Explore This Country on the Map</h3>
                <p id="countryMapFeedback" class="country-map-feedback">Loading map...</p>
            </div>
            <div id="countryMap" aria-label="Country detail map"></div>
        </section>

        <!-- Popular places call to action and generated result cards -->
        <section class="places-area">
            <p>Want to explore the most popular places across this country?</p>
            <button id="popularPlacesBtn" class="button" disabled>Show Popular Places</button>
            <p id="popularPlacesFeedback" class="places-feedback" hidden></p>

            <div id="popularPlacesGrid" class="cards-box">
                </div>
        </section>
    </main>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <!-- Country page behavior, map state, and popular place loading -->
    <script type="module" src="js/country.js"></script>
</body>
</html>
