<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraExplore | Discover the World</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <!-- Main menu page -->
    <header class="menu">
        <div class="logo">
            <a href="index.html"><h1>Terra Explore</h1></a>
        </div>
        
        <nav class="menu-links">
            <a href="#">About Us</a>
            <a href="#">Hidden Gems</a>
        </nav>

        <div class="menu-actions">
            <!-- Search button appearance -->
            <button type="button" class="button-text" aria-label="Search">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
            <button type="button" class="button-light">Sign Up</button>
        </div>
    </header>

    <main class="home-page">
        <section class="search-area">
            <h2>Find Your Next Destination</h2>
            <p>Enter a country name to explore its culture, facts, and hidden gems.</p>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="e.g., Japan, Italy, Brazil..." autocomplete="off">
                <button id="searchBtn" type="button" class="button">Explore</button>
            </div>
            <p id="errorMessage" class="error-text" hidden></p>
        </section>

        <section class="map-area">
            <div id="worldMapContainer">
                <p class="map-text">Interactive world map will be displayed here.</p>
            </div>
        </section>
    </main>

    <script type="module" src="js/home.js"></script>
    
    <footer class="footer">
        <p class="footer-text">&copy; 2026 Terra Explore. Developed for Web Technologies Course</p>
    </footer>
</body>
</html>
