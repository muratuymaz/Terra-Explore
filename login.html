<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraExplore | Login</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234e835f'/%3E%3Ctext x='50%25' y='53%25' text-anchor='middle' dominant-baseline='middle' font-size='36'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E">
    <link rel="shortcut icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234e835f'/%3E%3Ctext x='50%25' y='53%25' text-anchor='middle' dominant-baseline='middle' font-size='36'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>
    <!-- Top menu stays simple like the other pages -->
    <header class="menu">
        <div class="logo">
            <a class="logo-link" href="index.html">
                <h1>Terra Explore</h1>
                <span class="logo-mark" aria-hidden="true">🌍</span>
            </a>
        </div>

        <nav class="menu-links">
            <a href="index.html">Home</a>
            <a href="compare-countries.html">Compare Countries</a>
        </nav>

        <div class="menu-actions">
            <a class="button-light" href="index.html">Back Home</a>
        </div>
    </header>

    <!-- Login content -->
    <main class="signup-page">
        <section class="signup-hero">
            <h2>Welcome Back</h2>
            <p>Log in with the same simple demo account you created before.</p>
        </section>

        <section class="signup-grid">
            <!-- Demo login card that checks the locally saved account -->
            <form id="loginForm" class="signup-card" aria-label="Login form">
                <h3>Login</h3>

                <!-- Login fields for the local demo flow -->
                <label class="field">
                    <span>Email Address</span>
                    <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                </label>

                <label class="field">
                    <span>Password</span>
                    <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </label>

                <!-- Action buttons for login -->
                <div class="signup-actions">
                    <button type="submit" class="button">Login</button>
                    <a class="button-light" href="signup.html">Sign Up</a>
                </div>

                <p id="loginFeedback" class="signup-feedback" hidden aria-live="polite"></p>
                <p class="form-note">This login uses browser storage only. No database is used.</p>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p class="footer-text">&copy; 2026 Terra Explore. Developed for Web Technologies Course</p>
    </footer>

    <!-- Login page behavior -->
    <script type="module" src="js/login.js"></script>
</body>
</html>
